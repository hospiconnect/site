</section>

<section id="catalogo" class="max-w-7xl mx-auto px-4 mt-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-8"></section>

<div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
  <div class="bg-white p-6 max-w-3xl rounded-xl relative max-h-[80vh] overflow-y-auto">
    <button onclick="closeModal()" class="absolute top-2 right-3 text-xl">×</button>
    <h2 id="modalTitulo" class="text-xl font-black mb-3"></h2>
    <p id="modalDescricao" class="whitespace-pre-line text-sm leading-relaxed"></p>
  </div>
</div>

<footer class="text-center py-8 text-sm">© 2026 Hospiconnect. Todos os direitos reservados.</footer>

<script>
const poltronas = [
  {
    id:'4033', nome:'Poltrona Hospitalar 4033', img:'Poltrona4033.png',
    desc:`Poltrona hospitalar para acompanhante com sistema de reclinação por cremalheira e acionamento manual por alavanca lateral.

Permite ajuste gradual do encosto e apoio para pernas, proporcionando conforto durante longos períodos de permanência.

Estrutura em madeira com mecanismo interno em aço, garantindo resistência e estabilidade.

Revestida em courvin de fácil higienização, adequada para ambientes hospitalares e clínicos.

Indicada para quartos hospitalares, enfermarias e unidades de internação.

Suporta carga de até 150 kg.`
  },
  {
    id:'4038', nome:'Poltrona Hospitalar 4038', img:'Poltrona4038.png',
    desc:`Poltrona reclinável com elevação de pernas e função lift, projetada para facilitar a transferência do paciente.

Sistema de acionamento elétrico por controle com fio e dois botões.

Encosto e apoio para pernas ajustáveis, oferecendo alto nível de conforto.

Estrutura em madeira com mecanismo em aço e acabamento resistente.

Revestimento em courvin hospitalar de fácil limpeza.

Capacidade de carga de até 120 kg.`
  },
  {
    id:'4062', nome:'Sofá Cama Hospitalar 4062', img:'Poltrona4062.png',
    desc:`Sofá cama hospitalar com sistema de transformação simples e prática.

Para conversão em cama, basta ajustar os braços e encostos conforme o mecanismo integrado.

Estrutura em madeira com reforço em aço, garantindo durabilidade e segurança.

Estofamento em espuma D28, confortável e firme para uso prolongado.

Revestido em courvin de fácil higienização.

Inclui quatro almofadas estofadas para acabamento e conforto adicional.

Ideal para uso como poltrona de acompanhante em ambientes hospitalares.`
  }
];

const catalogo = document.getElementById('catalogo');

poltronas.forEach((p,i)=>{
  catalogo.innerHTML += `
    <div class="bg-white rounded-xl p-4 shadow text-center">
      <img src="${p.img}" class="mx-auto w-40 h-52 object-contain mb-4 cursor-pointer" onclick="openModal(${i})">
      <h3 class="font-bold mb-3">${p.nome}</h3>
      <div class="grid grid-cols-2 gap-3">
        <a href="https://wa.me/5561981964138?text=Quero%20COMPRAR%20${p.nome}" class="bg-emerald-600 text-white rounded py-2">Comprar</a>
        <a href="https://wa.me/5561981964138?text=Quero%20ALUGAR%20${p.nome}" class="bg-blue-600 text-white rounded py-2">Alugar</a>
      </div>
    </div>`;
});

function openModal(index){
  const p = poltronas[index];
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  modalTitulo.innerText = p.nome;
  modalDescricao.innerText = p.desc;
}

function closeModal(){ modal.classList.add('hidden'); }
</script>
