<section class="max-w-7xl mx-auto px-4 mt-8">
  <h1 class="text-3xl font-black text-center text-emerald-700">Catálogo de Camas Hospitalares</h1>
</section>

<section class="max-w-7xl mx-auto px-4 mt-8 grid md:grid-cols-3 gap-4">
  <select id="fTipo" class="p-2 rounded border"><option value="">Filtrar por tipo</option><option>Manual</option><option>Motorizada</option><option>Infantil</option><option>PPP</option></select>
  <select id="fModelo" class="p-2 rounded border"><option value="">Modelo</option></select>
  <button id="limpar" class="p-2 rounded border bg-white">Limpar filtros</button>
</section>

<section id="catalogo" class="max-w-7xl mx-auto px-4 mt-8 grid sm:grid-cols-2 lg:grid-cols-3 gap-8"></section>
<div class="text-center my-10"><button id="verMais" class="px-6 py-2 bg-emerald-600 text-white rounded">Ver mais</button></div>

<div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
  <div class="bg-white p-6 max-w-2xl rounded-xl relative max-h-[80vh] overflow-y-auto">
    <button onclick="closeModal()" class="absolute top-2 right-3 text-xl">×</button>
    <h2 id="modalTitulo" class="text-xl font-black mb-3"></h2>
    <p id="modalDescricao" class="whitespace-pre-line text-sm leading-relaxed"></p>
  </div>
</div>

<footer class="text-center py-8 text-sm">© 2026 Hospiconnect. Todos os direitos reservados.</footer>

<script>
const camas = [
  // MANUAIS (4)
  {id:'1005',tipo:'Manual',nome:'Cama Hospitalar Manual',desc:`Cama hospitalar manual com leito articulado em quatro seções.

Possui acionamento por manivelas escamoteáveis que permitem ajustes de cabeceira e pernas.

Estrutura em aço carbono com pintura eletrostática e tratamento antiferrugem.

Indicada para internações clínicas e uso hospitalar geral.

Carga segura elevada e registro ANVISA.`},
  {id:'1006',tipo:'Manual',nome:'Cama Hospitalar Manual Articulada',desc:`Cama hospitalar manual articulada com três manivelas.

Permite Fowler, Semi-Fowler, flexão de pernas, posição cardíaca e ajuste de altura conforme versão.

Estrutura em aço carbono reforçado, leito em quatro seções.

Grades laterais em PEAD.

Uso hospitalar contínuo, registrada na ANVISA.`},
  {id:'1008',tipo:'Manual',nome:'Cama Hospitalar Manual Reforçada',desc:`Cama manual reforçada para uso intensivo.

Movimentos Fowler, Cardíaco e Trendelenburg conforme modelo.

Estrutura robusta em aço carbono e acabamento anticorrosivo.

Indicada para hospitais e clínicas.`},
  {id:'1010',tipo:'Manual',nome:'Cama Hospitalar Alta Capacidade',desc:`Cama manual para pacientes de maior peso.

Capacidade de trabalho elevada, estrutura reforçada.

Leito articulado em quatro seções.

Indicada para internações especiais.`},

  // MOTORIZADAS (7)
  {id:'1031',tipo:'Motorizada',nome:'Cama Hospitalar Elétrica Básica',desc:`Cama elétrica hospitalar com ajustes essenciais.

Movimentos elétricos de dorso e pernas.

Estrutura em aço carbono.

Indicada para internações clínicas.`},
  {id:'1032',tipo:'Motorizada',nome:'Cama Hospitalar Elétrica',desc:`Cama elétrica com múltiplas variações.

Permite ajustes de posição e altura conforme modelo.

Grades em PEAD ou ABS.

Uso hospitalar geral.`},
  {id:'1033',tipo:'Motorizada',nome:'Cama Hospitalar Elétrica ABS',desc:`Cama elétrica com leito em ABS removível.

Facilita higienização e controle de infecção.

Movimentos elétricos completos.

Indicada para ambientes hospitalares exigentes.`},
  {id:'1037',tipo:'Motorizada',nome:'Cama Hospitalar Elétrica Premium',desc:`Modelo premium com múltiplas posições terapêuticas.

Inclui Fowler, Trendelenburg, Proclive e Poltrona.

Alta durabilidade e conforto ao paciente.`},
  {id:'1040',tipo:'Motorizada',nome:'Cama Elétrica Completa',desc:`Cama elétrica completa de alta complexidade.

Ajustes elétricos de altura, dorso e pernas.

Compatível com diversos acessórios.

Indicada para hospitais de médio e grande porte.`},
  {id:'1041',tipo:'Motorizada',nome:'Cama Elétrica com Alarmes',desc:`Cama elétrica com sistemas de segurança e alarmes.

Controle supervisor e recursos avançados.

Uso em internações críticas.`},
  {id:'1043',tipo:'Motorizada',nome:'Cama Elétrica com Balança',desc:`Cama elétrica com sistema de balança integrado.

Permite monitorar peso do paciente.

Indicada para UTIs e centros especializados.`},

  // PPP (2)
  {id:'1051',tipo:'PPP',nome:'Cama Hospitalar PPP',desc:`Cama para Pré-Parto, Parto e Pós-Parto.

Seção de pernas retrátil.

Acessórios obstétricos inclusos.

Uso em maternidades.`},
  {id:'1052',tipo:'PPP',nome:'Cama Hospitalar PPP Alternativa',desc:`Versão alternativa de cama PPP.

Acionamento elétrico.

Indicada para centros obstétricos.`},

  // INFANTIS (4)
  {id:'1080',tipo:'Infantil',nome:'Cama Hospitalar Infantil',desc:`Cama hospitalar infantil com leito fixo.

Dimensões reduzidas para pediatria.

Grades laterais seguras.

Uso hospitalar infantil.`},
  {id:'1082',tipo:'Infantil',nome:'Cama Hospitalar Infantil Articulada',desc:`Cama infantil articulada.

Movimentos Fowler e afins.

Estrutura em aço reforçado.`},
  {id:'1084',tipo:'Infantil',nome:'Cama Hospitalar Infantil Elétrica',desc:`Cama infantil com acionamento elétrico.

Maior ergonomia para o cuidado pediátrico.`},
  {id:'1085',tipo:'Infantil',nome:'Cama Hospitalar Infantil Manual',desc:`Cama infantil manual com articulação básica.

Indicada para cuidados clínicos pediátricos.`}
];

let limit = 6;
const cat = document.getElementById('catalogo');
const fTipo = document.getElementById('fTipo');
const fModelo = document.getElementById('fModelo');
const verMais = document.getElementById('verMais');

fModelo.innerHTML += [...new Set(camas.map(c=>c.id))].map(i=>`<option>${i}</option>`).join('');

function render(){
  const list = camas.filter(c => (!fTipo.value || c.tipo===fTipo.value) && (!fModelo.value || c.id===fModelo.value));
  const slice = (!fTipo.value && !fModelo.value) ? list.slice(0,limit) : list;
  verMais.style.display = (list.length > limit && !fTipo.value && !fModelo.value) ? 'inline-block' : 'none';
  cat.innerHTML = slice.map((c,i)=>`
    <div class="bg-white rounded-xl p-4 shadow text-center">
      <img src="Cama${c.id}.png" class="mx-auto w-40 h-52 object-contain mb-4 cursor-pointer" onclick="openModal(${camas.indexOf(c)})">
      <h3 class="font-bold mb-3">${c.nome} – ${c.id}</h3>
      <div class="grid grid-cols-2 gap-3">
        <a href="https://wa.me/5561981964138?text=Quero%20COMPRAR%20${c.nome}%20modelo%20${c.id}" class="bg-emerald-600 text-white rounded py-2">Comprar</a>
        <a href="https://wa.me/5561981964138?text=Quero%20ALUGAR%20${c.nome}%20modelo%20${c.id}" class="bg-blue-600 text-white rounded py-2">Alugar</a>
      </div>
    </div>`).join('');
}

function openModal(index){
  const c = camas[index];
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  modalTitulo.innerText = c.nome;
  modalDescricao.innerText = c.desc;
}

function closeModal(){ modal.classList.add('hidden'); }

verMais.onclick = ()=>{ limit=99; render(); };
fTipo.onchange = fModelo.onchange = render;
limpar.onclick = ()=>{ fTipo.value=''; fModelo.value=''; limit=6; render(); };

render();
</script>
</body>
</html>
